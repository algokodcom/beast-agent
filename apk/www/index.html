<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Beast Mobile</title>
<style>
  :root{ --bg:#0b1520; --panel:#12212e; --panel2:#16293a; --line:#22384c; --me:#0e4d3a; --me2:#0f5c46;
    --tx:#e8f1f8; --dim:#8ba3b8; --acc:#3fb6ff; --accent:#00cf70; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{ background:var(--bg); color:var(--tx); font:15px/1.45 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
  /* ---------- BAĞLAN EKRANI ---------- */
  #auth{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:28px; }
  #auth .logo{ width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#00cf70,#3fb6ff);
    display:flex; align-items:center; justify-content:center; font-size:34px; }
  #auth h1{ font-size:20px; }
  #auth .sub{ color:var(--dim); font-size:13px; text-align:center; max-width:320px; }
  #auth input{ width:100%; max-width:340px; background:var(--panel); border:1px solid var(--line); color:var(--tx);
    border-radius:12px; padding:13px 14px; font-size:16px; outline:none; }
  #auth input:focus{ border-color:var(--acc); }
  #auth button{ width:100%; max-width:340px; border:0; border-radius:12px; padding:14px; font-size:15.5px; font-weight:800;
    background:linear-gradient(135deg,#00cf70,#0aa860); color:#04240f; }
  #auth button:active{ opacity:.85; }
  #authNote{ color:var(--dim); font-size:12px; max-width:340px; text-align:center; }
  #authErr{ color:#ff8a8a; font-size:13px; min-height:18px; }
  /* ---------- CHAT EKRANI ---------- */
  #app{ flex:1; display:none; flex-direction:column; min-height:0; }
  header{ background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px; flex:0 0 auto; }
  header .st{ flex:1; min-width:0; }
  header .nm{ font-weight:800; font-size:15.5px; display:flex; align-items:center; gap:7px; white-space:nowrap; }
  header .dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex:0 0 auto; }
  header .mega{ color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #sess{ background:var(--panel2); border:1px solid var(--line); color:var(--tx); border-radius:10px;
    max-width:140px; font-size:13px; padding:6px 8px; flex:0 0 auto; outline:none; }
  #exit,#newsess{ background:none; border:0; color:var(--dim); font-size:20px; padding:2px 4px; }
  #msgs{ flex:1; overflow-y:auto; padding:12px 12px 6px; display:flex; flex-direction:column; gap:8px; min-height:0; }
  .row{ display:flex; }
  .row.me{ justify-content:flex-end; }
  .bub{ max-width:82%; background:var(--panel2); border:1px solid var(--line); border-radius:14px 14px 14px 4px;
    padding:9px 12px; font-size:15px; word-wrap:break-word; overflow-wrap:anywhere; }
  .row.me .bub{ background:linear-gradient(160deg,var(--me),var(--me2)); border-color:#123d30; border-radius:14px 14px 4px 14px; }
  .bub img{ max-width:100%; border-radius:10px; display:block; margin-top:6px; }
  .bub .fchip{ display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.07); border:1px solid var(--line);
    border-radius:9px; padding:5px 9px; font-size:13px; margin:4px 6px 4px 0; }
  .bub code{ background:rgba(255,255,255,.08); padding:1px 5px; border-radius:5px; font-size:13.5px; }
  .bub a{ color:var(--acc); word-break:break-all; }
  .sysb{ align-self:center; background:rgba(63,182,255,.10); color:#9fd8ff; border:1px solid rgba(63,182,255,.25);
    border-radius:10px; padding:5px 11px; font-size:12.5px; max-width:90%; text-align:center; }
  .toolchip{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim);
    background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:8px; padding:3px 8px; margin-top:3px; }
  .typing{ color:var(--dim); font-size:12.5px; padding:2px 6px; display:none; }
  .typing.on{ display:block; }
  footer{ background:var(--panel); border-top:1px solid var(--line); padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    display:flex; gap:8px; align-items:flex-end; flex:0 0 auto; }
  #input{ flex:1; background:var(--panel2); border:1px solid var(--line); color:var(--tx); border-radius:18px;
    padding:11px 14px; font-size:15.5px; outline:none; resize:none; max-height:110px; min-height:42px; }
  #input:focus{ border-color:var(--acc); }
  #attach{ background:var(--panel2); border:1px solid var(--line); width:44px; height:44px;
    border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  #send{ border:0; background:linear-gradient(135deg,#00cf70,#0aa860); color:#04240f; width:44px; height:44px;
    border-radius:50%; font-size:19px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .attrow{ display:flex; gap:6px; flex-wrap:wrap; padding:0 2px 6px; }
  .attrow .c{ display:inline-flex; align-items:center; gap:6px; background:var(--panel2); border:1px solid var(--line);
    color:var(--tx); border-radius:9px; padding:5px 8px; font-size:12.5px; }
  .attrow .c .x{ color:var(--dim); font-weight:800; }
  ::-webkit-scrollbar{ width:4px; } ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:2px; }
</style>
</head>
<body>

<div id="auth">
  <div class="logo">
    <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
      <rect x="6" y="2.5" width="12" height="19" rx="2.4" fill="none" stroke="#04240f" stroke-width="2"/>
      <path d="M9 5.8h6" stroke="#04240f" stroke-width="2" stroke-linecap="round"/>
      <path d="M3.4 8.2c-1.1 2.4-1.1 5.2 0 7.6M20.6 8.2c1.1 2.4 1.1 5.2 0 7.6" fill="none" stroke="#04240f" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Beast Mobile</h1>
  <div class="sub">Bağlanmak için masaüstünde <b>Ayarlar → Beast Mobile</b> ekranında yazan <b>bilgisayar adresini</b> ve <b>cihaz kodunu</b> gir.</div>
  <input id="host" placeholder="PC adresi (ör. 192.168.1.34)" inputmode="url" autocomplete="off">
  <input id="code" placeholder="BEAST-XXXX-XXXX" autocapitalize="characters" autocomplete="off">
  <div id="authErr"></div>
  <button id="btnJoin">Bağlan</button>
  <div id="authNote">Telefon ile bilgisayar aynı Wi-Fi ağında olmalı.</div>
</div>

<div id="app">
  <header>
    <div class="st">
      <div class="nm"><span class="dot" id="hdot"></span> Beast <span id="hname" style="color:var(--dim);font-weight:600;font-size:12.5px"></span></div>
      <div class="mega" id="hmega">hazır</div>
    </div>
    <select id="sess"></select>
    <button id="newsess" title="Yeni sohbet" aria-label="Yeni sohbet">＋</button>
    <button id="exit" title="Çık">⏻</button>
  </header>
  <div id="msgs"></div>
  <div class="typing" id="typing"> Beast yazıyor…</div>
  <div id="attwrap" class="attrow" style="display:none"></div>
  <footer>
    <input id="input" placeholder=" mesaj yaz / soru sor…" enterkeyhint="send" autocomplete="off">
    <button id="attach" aria-label="Resim ekle">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M21 11l-8.2 8.2a6 6 0 0 1-8.5-8.5l8.7-8.7a4 4 0 0 1 5.7 5.7l-8.4 8.4a2 2 0 0 1-2.8-2.8l7.5-7.5" fill="none" stroke="#e8f1f8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="send" aria-label="Gönder">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
        <path d="M3.6 11.1 20 3.4a.95.95 0 0 1 1.3 1.2l-4.6 15.5a.8.8 0 0 1-1.4.2l-3.5-4.6-5-2.3a1 1 0 0 1-.2-1.8z" fill="#04240f" transform="rotate(90 12 12)"/>
      </svg>
    </button>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
