# Beast Agent provider configuration example.
# Usage: copy this file to %APPDATA%\beast\config.yaml and edit it.
# (For portable setups, set the BEAST_DATA environment variable to use another folder.)

# RECOMMENDED: OpenCode Zen — free models, no credit card required (opencode.ai/auth)
# NOTE: Zen free models may reject direct requests with 429 FreeUsageLimitError.
# Use Settings → Provider → “OpenCode Bridge Kur (Free Zen)” for the official
# OpenCode-client bridge; it registers a local provider automatically.
providers:
  opencode:
    name: OpenCode Zen
    base_url: https://opencode.ai/zen/v1
    key_env: OPENCODE_API_KEY
    models:
      glm-5.2: {}
      kimi-k2.7-code: {}
      big-pickle: {}
      beam-free: {}
      deepseek-v4.1-flash-free: {}
      minimax-m3: {}
  # If you have an OpenCode Go subscription, use base_url: https://opencode.ai/zen/go/v1

  zhipu:
    name: Zhipu AI
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZHIPU_API_KEY
    models:
      glm-4.6: {}
      glm-4.5-air: {}

  openai:
    name: OpenAI
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    models:
      gpt-4o-mini: {}
      gpt-4o: {}

  # Optional prompt-cache overrides (per provider). Beast auto-detects the
  # provider/model route; use these only when a custom endpoint needs a hint.
  #   cache: auto | qwen | anthropic | none
  #     auto      = last tool + system boundaries + conversation tail (4 breakpoints)
  #     qwen      = Qwen-style cache_control on system + conversation tail
  #                 (Qwen caches tools together with the system prompt)
  #     anthropic = same as auto (explicit Anthropic-compatible route)
  #     none      = no inline cache_control; OpenAI-style providers still use
  #                 prompt_cache_key/session affinity where supported
  #   cache_format: anthropic   # alias for cache: anthropic
  #   cache_ttl_seconds: 3600   # >=3600 sends ttl:"1h" where supported
  #
  # openrouter:
  #   name: OpenRouter
  #   base_url: https://openrouter.ai/api/v1
  #   key_env: OPENROUTER_API_KEY
  #   cache: auto
  #   cache_ttl_seconds: 3600
  #   models:
  #     anthropic/claude-sonnet-4.5: {}

model:
  provider: opencode  # default provider id (the first provider is used if omitted)
  default: glm-5.2    # default model
  # base_url: ...      # optionally override the active provider URL
  # key_env: ...       # optionally read the key from a different env variable
